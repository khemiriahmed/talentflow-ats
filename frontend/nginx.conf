server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # CV de 5 Mo maximum (+ marge pour le reste du formulaire)
  client_max_body_size 6m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/security-headers.conf;

  # L'API est servie sur la même origine : pas de CORS à configurer.
  # Le nom "backend" est résolu à chaque requête (le DNS de Docker Compose), pas au démarrage de nginx.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    include /etc/nginx/security-headers.conf;
  }

  # Fichiers générés par Angular : le nom contient une empreinte, donc cache longue durée sans risque.
  location ~* "-[A-Za-z0-9]{8}\.(?:js|css|woff2)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Application monopage : toute autre adresse renvoie index.html (le routeur Angular prend le relais).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }
}
