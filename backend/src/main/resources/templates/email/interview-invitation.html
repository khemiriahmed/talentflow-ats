<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body style="margin:0;background:#f1f5f9;">
<div style="max-width:600px;margin:0 auto;background:#ffffff;">
    <div th:replace="~{email/fragments :: header}"></div>
    <div style="padding:24px;font-family:Arial,sans-serif;font-size:15px;color:#0f172a;line-height:1.5;">
        <p>Bonjour <span th:text="${recipientName}">Prénom Nom</span>,</p>

        <p th:if="${audienceCandidate}">Nous avons le plaisir de vous inviter à un entretien pour le poste
            <strong th:text="${jobTitle}">Titre du poste</strong>.</p>
        <p th:unless="${audienceCandidate}">Un entretien avec
            <strong th:text="${candidateName}">Candidat</strong> a été planifié pour le poste
            <strong th:text="${jobTitle}">Titre du poste</strong>. Vous y participez.</p>

        <div th:replace="~{email/fragments :: interviewDetails}"></div>

        <p th:if="${audienceCandidate}">En cas d'empêchement, merci de nous prévenir au plus vite.</p>
        <p>Cordialement,<br>L'équipe recrutement</p>
    </div>
    <div th:replace="~{email/fragments :: footer}"></div>
</div>
</body>
</html>
