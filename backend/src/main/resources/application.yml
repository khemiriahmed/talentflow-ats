spring:
  application:
    name: talentflow-backend
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ats}
    username: ${SPRING_DATASOURCE_USERNAME:ats}
    password: ${SPRING_DATASOURCE_PASSWORD:ats_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # le schéma est géré uniquement par Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    mail:
      enabled: false   # l'envoi d'emails n'est pas critique pour la santé de l'API
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth:
    # En production, passer à true : la connexion exige alors une adresse email vérifiée.
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}
  rate-limit:
    auth:
      max-requests: ${AUTH_RATE_LIMIT_PER_MINUTE:100}
  mail:
    from: ${MAIL_FROM:no-reply@talentflow.local}
    base-url: ${APP_BASE_URL:http://localhost:4200}
    timezone: ${APP_TIMEZONE:Europe/Paris}   # fuseau d'affichage des dates dans les emails
  reminders:
    enabled: true
    interval: PT15M
    initial-delay: PT1M
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-change-me-in-prod}
    access-token-minutes: 15
    refresh-token-days: 7
  storage:
    # Vide = AWS S3 réel (credentials via la chaîne par défaut AWS). Renseigné = mock S3 / GCS interop.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9090}
    bucket: ${STORAGE_BUCKET:ats-cv}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:test}
    secret-key: ${STORAGE_SECRET_KEY:test}
    path-style: ${STORAGE_PATH_STYLE:true}
